services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ufo
      POSTGRES_DB: ufo_development
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - ufo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufo -d ufo_development"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ufo-postgres:
